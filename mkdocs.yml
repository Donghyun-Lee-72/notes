      - "General Chemistry Map and Learning Path": materials-science/chemistry.md
      - "Chemical Language, the Mole, and Stoichiometry": materials-science/chemical-language-mole-stoichiometry.md
      - "Atomic Structure and Periodic Trends": materials-science/atomic-structure-periodic-trends.md
      - "Chemical Bonding, Molecular Structure, and Intermolecular Forces": materials-science/chemical-bonding-molecular-structure-intermolecular-forces.md
      - "Aqueous Reactions and Net Ionic Equations": materials-science/aqueous-reactions-net-ionic-equations.md
      - "Redox Foundations and Half-Reaction Balancing": materials-science/redox-foundations-half-reaction-balancing.md
      - "Thermochemistry, Entropy, and Gibbs Energy": materials-science/thermochemistry-entropy-gibbs-energy.md
      - "Chemical Equilibrium, Acids and Bases, and Solubility": materials-science/chemical-equilibrium-acids-bases-solubility.md
