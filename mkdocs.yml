site_name: Notes
site_description: Concise, connected notes on AI, materials science, and chemistry.
site_url: https://notes.donghyunlee.me/
repo_url: https://github.com/Donghyun-Lee-72/notes
site_author: Donghyun Lee
copyright: Maintained by Donghyun Lee
theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
plugins:
  - search
  - redirects:
      redirect_maps:
        ai-ai4science/index.md: ai/index.md
        learn/electron-microscopy-sem-tem.md: materials-science/electron-microscopy-sem-tem.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
extra_css:
  - assets/stylesheets/editorial.css
  - assets/stylesheets/navigation.css
extra_javascript:
  - assets/javascripts/navigation.js
  - assets/javascripts/site-analytics.js
extra:
  analytics:
    provider: google
    property: G-6Z3WTNQ64Q
nav:
  - Start: index.md
  - AI:
      - ai/index.md
      - Foundations:
          - Large Language Models: learn/large-language-models.md
          - Tokenization: learn/tokenization.md
          - Transformers: learn/transformers.md
          - Context Windows: learn/context-windows.md
          - Embeddings: learn/embeddings.md
          - Prompting: learn/prompting.md
      - Build:
          - AI Agents: build/ai-agents.md
          - Workflows and Agents: build/workflows-and-agents.md
          - Agent Memory: build/agent-memory.md
          - Tool Use and Function Calling: build/tool-use-and-function-calling.md
          - Structured Output: build/structured-output.md
          - Retrieval-Augmented Generation: build/retrieval-augmented-generation.md
          - Reranking: build/reranking.md
          - Pydantic: tools/pydantic.md
          - LangChain and LangGraph: tools/langchain-langgraph.md
          - Vector Databases: tools/vector-databases.md
      - Evaluate:
          - Grounding and Hallucination: evaluate/grounding-and-hallucination.md
          - LLM Evaluation: evaluate/llm-evaluation.md
          - RAG Evaluation: evaluate/rag-evaluation.md
      - AI4Science:
          - Overview: ai4science/index.md
          - LLM Agents for Scientific Discovery: ai4science/llm-agents-for-scientific-discovery.md
          - Self-Driving Laboratories: ai4science/self-driving-laboratories.md
  - Materials Science and Chemistry:
      - materials-science/index.md
      - "Materials Science and Engineering Framework": materials-science/materials-science-engineering-framework.md
      - "Materials Classification and Selection": materials-science/materials-classification-and-selection.md
      - "Atomic Structure and Interatomic Bonding in Materials": materials-science/atomic-structure-and-interatomic-bonding.md
      - "Crystal Structures and Unit Cells": materials-science/crystal-structures-unit-cells.md
      - "Crystallographic Directions and Planes": materials-science/crystallographic-directions-and-planes.md
      - "Imperfections and Defects in Solids": materials-science/imperfections-and-defects-in-solids.md
      - "Thermodynamic Systems, Laws, and Potentials": materials-science/thermodynamic-systems-laws-potentials.md
      - "Chemical Potential, Activity, and Partial Molar Properties": materials-science/chemical-potential-activity-and-partial-molar-properties.md
      - "Unary Phase Equilibria": materials-science/unary-phase-equilibria.md
      - "Diffusion and Transport in Solids": materials-science/diffusion-and-transport-in-solids.md
      - "Electron Microscopy: SEM and TEM": materials-science/electron-microscopy-sem-tem.md
      - "Crystal Diffraction, Reciprocal Space, and Disorder": materials-science/crystal-diffraction-reciprocal-space.md
      - "Powder X-ray Diffraction": materials-science/powder-x-ray-diffraction.md
      - "PXRD Simulation and Rietveld Refinement": materials-science/pxrd-simulation-and-refinement.md
      - "Computing PXRD Patterns with pymatgen": materials-science/pymatgen-pxrd.md
