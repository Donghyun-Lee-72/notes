<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc">
  <title id="title">Materials science and chemistry orientation map</title>
  <desc id="desc">Shared foundations lead to three peer concept routes: chemistry foundations, structure and defects, and thermodynamic state. Readers then continue through either characterization or change over time toward applied decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#536b75"/>
    </marker>
    <style>
      .edge{fill:none;stroke:#536b75;stroke-width:3;marker-end:url(#arrow)}
      .zone{fill:#f8fafb;stroke:#91a2a9;stroke-width:2}
      .node{stroke:#38555f;stroke-width:2}
      .foundation{fill:#dcecef}.chemistry{fill:#e8edf5}.structure{fill:#e7ecef}
      .thermo{fill:#f1eadc}.change{fill:#e4eee7}.evidence{fill:#f4f6f7}.decision{fill:#f3e5dc}
      .title{font:700 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17252b;text-anchor:middle}
      .subtitle{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#536b75;text-anchor:middle}
      .zone-label{font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#38555f;text-anchor:middle}
      .label{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17252b;text-anchor:middle}
      .small{font:18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334a53;text-anchor:middle}
      .key{font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#536b75;text-anchor:middle}
    </style>
  </defs>

  <text class="title" x="500" y="34">Materials Science &amp; Chemistry</text>
  <text class="subtitle" x="500" y="62">orientation map of major routes</text>

  <rect class="node foundation" x="310" y="84" width="380" height="76" rx="16"/>
  <text class="label" x="500" y="115">Shared foundations</text>
  <text class="small" x="500" y="143">framework · classification · bonding</text>

  <path class="edge" d="M500 160 V202"/>

  <rect class="zone" x="25" y="214" width="950" height="232" rx="22"/>
  <text class="zone-label" x="500" y="242">Choose a concept route</text>

  <rect class="node chemistry" x="50" y="260" width="280" height="160" rx="16"/>
  <text class="label" x="190" y="290">Chemistry foundations</text>
  <text class="small" x="190" y="322">general chemistry map · mole</text>
  <text class="small" x="190" y="350">atoms · bonding · reactions</text>
  <text class="small" x="190" y="378">redox · thermochemistry</text>

  <rect class="node structure" x="360" y="260" width="280" height="160" rx="16"/>
  <text class="label" x="500" y="290">Structure &amp; defects</text>
  <text class="small" x="500" y="330">crystal structures</text>
  <text class="small" x="500" y="358">directions &amp; planes</text>
  <text class="small" x="500" y="386">imperfections &amp; defects</text>

  <rect class="node thermo" x="670" y="260" width="280" height="160" rx="16"/>
  <text class="label" x="810" y="290">Thermodynamic state</text>
  <text class="small" x="810" y="330">systems · laws · potentials</text>
  <text class="small" x="810" y="358">chemical potential · activity</text>
  <text class="small" x="810" y="386">equilibrium</text>

  <path class="edge" d="M500 446 V488"/>

  <rect class="zone" x="120" y="500" width="760" height="184" rx="22"/>
  <text class="zone-label" x="500" y="528">Continue by question</text>

  <rect class="node evidence" x="145" y="546" width="340" height="112" rx="16"/>
  <text class="label" x="315" y="577">Characterization</text>
  <text class="small" x="315" y="607">microscopy · reciprocal space · PXRD</text>
  <text class="small" x="315" y="635">simulation · software selection</text>

  <rect class="node change" x="515" y="546" width="340" height="112" rx="16"/>
  <text class="label" x="685" y="577">Change over time</text>
  <text class="small" x="685" y="607">kinetics · diffusion &amp; transport</text>
  <text class="small" x="685" y="635">electrochemistry</text>

  <path class="edge" d="M500 684 V724"/>

  <rect class="node decision" x="250" y="736" width="500" height="62" rx="16"/>
  <text class="label" x="500" y="762">Applied decisions</text>
  <text class="small" x="500" y="787">materials selection · MOF case study · service evidence</text>
</svg>
