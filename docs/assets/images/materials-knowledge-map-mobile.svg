<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1160" role="img" aria-labelledby="title desc">
  <title id="title">Mobile materials science and chemistry knowledge map</title>
  <desc id="desc">A vertical navigation map of published notes from shared foundations through chemistry, structure, thermodynamics, kinetics and transport, characterization, and engineering decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#536b75"/>
    </marker>
    <style>
      .edge{fill:none;stroke:#536b75;stroke-width:4;marker-end:url(#arrow)}
      .edge-soft{fill:none;stroke:#7a8d94;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .node{stroke:#38555f;stroke-width:2.5}
      .foundation{fill:#dcecef}.chemistry{fill:#e8edf5}.structure{fill:#e7ecef}
      .thermo{fill:#f1eadc}.change{fill:#e4eee7}.evidence{fill:#f4f6f7}.decision{fill:#f3e5dc}
      .title{font:700 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17252b;text-anchor:middle}
      .label{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17252b;text-anchor:middle}
      .small{font:18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334a53;text-anchor:middle}
      .key{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#536b75;text-anchor:middle}
    </style>
  </defs>

  <path class="edge" d="M190 155 V190"/>
  <path class="edge" d="M190 320 V355"/>
  <path class="edge" d="M190 485 V520"/>
  <path class="edge" d="M190 650 V685"/>
  <path class="edge-soft" d="M190 815 V850"/>
  <path class="edge-soft" d="M190 980 V1015"/>

  <text class="title" x="190" y="32">Materials Science &amp; Chemistry</text>
  <text class="key" x="190" y="58">published-note navigation map</text>

  <rect class="node foundation" x="35" y="85" width="310" height="70" rx="16"/>
  <text class="label" x="190" y="113">Shared foundations</text>
  <text class="small" x="190" y="140">framework · classification · bonding</text>

  <rect class="node chemistry" x="35" y="190" width="310" height="130" rx="16"/>
  <text class="label" x="190" y="220">Chemistry foundations</text>
  <text class="small" x="190" y="252">mole · atoms · bonding</text>
  <text class="small" x="190" y="279">aqueous reactions · redox</text>
  <text class="small" x="190" y="306">thermochemistry</text>

  <rect class="node structure" x="35" y="355" width="310" height="130" rx="16"/>
  <text class="label" x="190" y="385">Structure &amp; defects</text>
  <text class="small" x="190" y="417">crystal structures</text>
  <text class="small" x="190" y="444">directions &amp; planes</text>
  <text class="small" x="190" y="471">imperfections &amp; defects</text>

  <rect class="node thermo" x="35" y="520" width="310" height="130" rx="16"/>
  <text class="label" x="190" y="550">Thermodynamic state</text>
  <text class="small" x="190" y="582">systems · laws · potentials</text>
  <text class="small" x="190" y="609">chemical potential · activity</text>
  <text class="small" x="190" y="636">equilibrium</text>

  <rect class="node change" x="35" y="685" width="310" height="130" rx="16"/>
  <text class="label" x="190" y="715">Change over time</text>
  <text class="small" x="190" y="747">reaction kinetics</text>
  <text class="small" x="190" y="774">diffusion &amp; transport</text>
  <text class="small" x="190" y="801">electrochemistry</text>

  <rect class="node evidence" x="35" y="850" width="310" height="130" rx="16"/>
  <text class="label" x="190" y="880">Characterization</text>
  <text class="small" x="190" y="912">electron microscopy</text>
  <text class="small" x="190" y="939">reciprocal space · PXRD</text>
  <text class="small" x="190" y="966">simulation · refinement</text>

  <rect class="node decision" x="35" y="1015" width="310" height="115" rx="16"/>
  <text class="label" x="190" y="1045">Engineering decisions</text>
  <text class="small" x="190" y="1077">service · trade-offs</text>
  <text class="small" x="190" y="1104">evidence · validation</text>

  <text class="key" x="190" y="1150">A reading route, not a one-way physical law.</text>
</svg>
