<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Materials science and engineering dependency map</title>
  <desc id="desc">Composition and environment constrain a four-stage path from processing history through structure and properties to performance. Service feedback returns from performance to processing, while characterization and computation test every link.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f6770"/>
    </marker>
    <marker id="feedback-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5b31"/>
    </marker>
    <style>
      .edge{fill:none;stroke:#4f6770;stroke-width:3;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#8a5b31;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#feedback-arrow)}
      .guide{fill:none;stroke:#74868e;stroke-width:2;stroke-dasharray:5 6}
      .node{stroke:#37535d;stroke-width:2}
      .input{fill:#dcecef}
      .process{fill:#e7ecef}
      .response{fill:#e4eee7}
      .outcome{fill:#f3e9d8}
      .evidence{fill:#f5f7f8;stroke:#74868e;stroke-width:2}
      .label{font:600 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17252b;text-anchor:middle}
      .small{font:24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#3f535b;text-anchor:middle}
      .caption{font:600 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#74491f;text-anchor:middle}
    </style>
  </defs>

  <path class="edge" d="M230 214 H285"/>
  <path class="edge" d="M455 214 H510"/>
  <path class="edge" d="M680 214 H735"/>
  <path class="feedback" d="M820 278 C820 345 145 345 145 278"/>
  <path class="guide" d="M145 140 V112"/>
  <path class="guide" d="M370 140 V112"/>
  <path class="guide" d="M595 140 V112"/>
  <path class="guide" d="M820 140 V112"/>
  <path class="guide" d="M145 278 V330"/>
  <path class="guide" d="M370 278 V330"/>
  <path class="guide" d="M595 278 V330"/>
  <path class="guide" d="M820 278 V330"/>

  <rect class="node input" x="60" y="24" width="845" height="88" rx="18"/>
  <text class="label" x="482" y="59">Composition + environment</text>
  <text class="small" x="482" y="88">constrain every stage</text>

  <rect class="node process" x="60" y="140" width="170" height="138" rx="18"/>
  <text class="label" x="145" y="190">Processing</text>
  <text class="small" x="145" y="223">history</text>
  <text class="small" x="145" y="249">+ conditions</text>

  <rect class="node process" x="285" y="140" width="170" height="138" rx="18"/>
  <text class="label" x="370" y="190">Structure</text>
  <text class="small" x="370" y="238">many scales</text>

  <rect class="node response" x="510" y="140" width="170" height="138" rx="18"/>
  <text class="label" x="595" y="190">Properties</text>
  <text class="small" x="595" y="223">depends on</text>
  <text class="small" x="595" y="249">conditions</text>

  <rect class="node outcome" x="735" y="140" width="170" height="138" rx="18"/>
  <text class="label" x="820" y="190">Performance</text>
  <text class="small" x="820" y="223">works in</text>
  <text class="small" x="820" y="249">service?</text>

  <rect x="315" y="297" width="334" height="32" fill="#f8fafb"/>
  <text class="caption" x="482" y="320">service feedback and redesign</text>

  <rect class="evidence" x="60" y="330" width="845" height="76" rx="18"/>
  <text class="label" x="482" y="365">Characterization + computation</text>
  <text class="small" x="482" y="392">test every link</text>
</svg>
